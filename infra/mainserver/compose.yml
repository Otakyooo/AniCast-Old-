services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    mem_limit: 768m
    restart: unless-stopped
    env_file: ${ANICAST_ENV_FILE:-.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Stock defaults assume a bigger machine: the 5-minute checkpoint collided
    # with the hourly provider import on a single CPU and a 908-buffer flush
    # took a 100-second write phase, starving the API into three 5xx. Fewer and
    # larger checkpoints keep the flush inside the import window rather than on
    # top of live traffic.
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "checkpoint_timeout=30m", "-c", "max_wal_size=2GB", "-c", "checkpoint_completion_target=0.9"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: &container-logging
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
    networks: [internal]
  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    mem_limit: 256m
    # Redis holds the Celery broker, so anything that can reach it can execute
    # code in the worker: task names are public. requirepass is the difference
    # between "reachable" and "exploitable".
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory 200mb --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\""]
    env_file: ${ANICAST_ENV_FILE:-.env}
    volumes:
      - redis_data:/data
    healthcheck:
      # REDISCLI_AUTH keeps the password out of the process list and out of
      # redis-cli's "using a password with -a" warning on stderr.
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *container-logging
    networks: [internal]
  # Disposable cache only. Throttles/locks use redis-control below.
  redis-cache:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    mem_limit: 96m
    command: ["sh", "-c", "exec redis-server --save '' --appendonly no --maxmemory 64mb --maxmemory-policy allkeys-lru --requirepass \"$${CACHE_REDIS_PASSWORD:?cache password missing}\""]
    env_file: ${ANICAST_ENV_FILE:-.env}
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$CACHE_REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *container-logging
    networks: [internal]
  # Persistent coordination state is independent from both broker and cache.
  redis-control:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    mem_limit: 96m
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy noeviction --requirepass \"$${CONTROL_REDIS_PASSWORD:?control password missing}\""]
    env_file: ${ANICAST_ENV_FILE:-.env}
    volumes:
      - control_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$CONTROL_REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *container-logging
    networks: [internal]
  backend:
    image: ${BACKEND_IMAGE:-anicast-backend:local}
    build: ../../backend
    mem_limit: 512m
    restart: unless-stopped
    env_file: ${ANICAST_ENV_FILE:-.env}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      redis-control: {condition: service_healthy}
    ports:
      - "10.78.0.2:8000:8000"
    volumes:
      - poster_media:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://localhost:8000/health/ready', headers={'X-Forwarded-Proto': 'https'}), timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *container-logging
    # The metrics network exists so the monitoring stack can scrape the backend
    # without joining the network that also carries PostgreSQL and Redis. Docker
    # DNS answers are per-network, so a container attached only to `metrics`
    # cannot even resolve `postgres` or `redis`.
    networks: [internal, metrics]
  celery-worker: &celery-worker
    image: ${BACKEND_IMAGE:-anicast-backend:local}
    build: ../../backend
    mem_limit: 256m
    stop_grace_period: 600s
    restart: unless-stopped
    env_file: ${ANICAST_ENV_FILE:-.env}
    command: ["celery", "-A", "config", "worker", "-l", "INFO", "-Q", "default,notifications", "--concurrency", "1"]
    volumes:
      - poster_media:/app/media
    depends_on: {backend: {condition: service_healthy}}
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --destination celery@$${HOSTNAME} --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *container-logging
    networks: [internal]
  # Slow provider probes/imports cannot occupy the notification worker slot.
  celery-bulk:
    <<: *celery-worker
    mem_limit: 512m
    # refresh_title_posters has a hard task limit of 1800s; leave shutdown margin.
    stop_grace_period: 1900s
    command: ["celery", "-A", "config", "worker", "-l", "INFO", "-Q", "providers,posters,maintenance,analytics", "--concurrency", "1"]
  celery-beat:
    image: ${BACKEND_IMAGE:-anicast-backend:local}
    build: ../../backend
    mem_limit: 128m
    restart: unless-stopped
    env_file: ${ANICAST_ENV_FILE:-.env}
    command: ["celery", "-A", "config", "beat", "-l", "INFO", "--pidfile=/tmp/celerybeat.pid"]
    depends_on: {backend: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "python", "-c", "import os; pid=int(open('/tmp/celerybeat.pid').read()); os.kill(pid, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *container-logging
    networks: [internal]
networks:
  internal:
  # Scrape-only network shared with the monitoring stack. It carries the backend
  # and nothing else, so joining it grants no path to PostgreSQL or Redis.
  metrics:
    name: mainserver_metrics
volumes:
  postgres_data:
  redis_data:
  control_data:
  poster_media:

services:
  frontend:
    mem_limit: 512m
    init: true
    security_opt: [no-new-privileges:true]
    image: ${FRONTEND_IMAGE:-anicast-frontend:local}
    build:
      context: ../../frontend
      args:
        NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME:-}
        NEXT_PUBLIC_TELEGRAM_NOTIFY_BOT_USERNAME: ${NEXT_PUBLIC_TELEGRAM_NOTIFY_BOT_USERNAME:-}
    restart: unless-stopped
    env_file: ${ANICAST_ENV_FILE:-.env}
    # Next.js standalone treats HOSTNAME as its bind address; Docker injects
    # the container id, which leaves loopback unusable for the healthcheck.
    environment:
      - HOSTNAME=0.0.0.0
      - NODE_OPTIONS=--max-old-space-size=320
    volumes:
      - frontend_images:/app/.next/cache/images
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: &container-logging
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    network_mode: host
    env_file: ${ANICAST_ENV_FILE:-.env}
    depends_on:
      frontend: {condition: service_healthy}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *container-logging
volumes:
  frontend_images:
  caddy_data:
  caddy_config:

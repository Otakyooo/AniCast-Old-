groups:
  - name: anicast-backend
    rules:
      - alert: RedisRoleDown
        expr: anicast_redis_up == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Redis {{ $labels.role }} недоступен более 3 минут"
      - alert: RedisPersistentMemoryPressure
        expr: anicast_redis_used_memory_bytes{role=~"control|broker"} / anicast_redis_maxmemory_bytes{role=~"control|broker"} > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis {{ $labels.role }} использует более 80% maxmemory"
      - alert: BackendDown
        expr: up{job="anicast-backend"} == 0 or absent(up{job="anicast-backend"})
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "AniCast backend недоступен или scrape не работает более 3 минут"
      - alert: High5xxRate
        expr: sum(increase(anicast_http_requests_total{status_family="5xx"}[15m])) > 10
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Растёт число 5xx-ответов backend: {{ $value | humanize }} за 15 минут"
      - alert: EndpointGroupErrorRatio
        # The absolute counter above only fires on volume. One endpoint group
        # answering 500 for every request while the rest of the site is healthy
        # produces few errors per minute on a low-traffic site, so a ratio is
        # what actually catches a broken feature. The 20-request floor keeps a
        # single stray error from alerting on an idle group.
        expr: |
          sum by (endpoint) (increase(anicast_http_requests_total{status_family="5xx"}[15m]))
            /
          clamp_min(sum by (endpoint) (increase(anicast_http_requests_total[15m])), 1) > 0.2
          and
          sum by (endpoint) (increase(anicast_http_requests_total[15m])) >= 20
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Группа {{ $labels.endpoint }} отвечает ошибками: {{ $value | humanizePercentage }} запросов за 15 минут"
      - alert: PendingMigrations
        # A model referencing columns the schema lacks answers 500 on every
        # request that touches them. In production that state went unnoticed for
        # an hour because only the symptom was visible; this alerts on the cause.
        expr: anicast_pending_migrations > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Есть неприменённые миграции ({{ $value }}): схема БД отстаёт от кода"
      - alert: AlertDeliveryFailing
        # Every rule in this file is worthless if the notification never lands.
        # Alertmanager retried Telegram 274 times and gave up each time while the
        # egress path from MainServer was blocked, and nothing said so.
        #
        # Summed by integration on purpose: the counter also carries a `reason`
        # label, so the bare metric would raise one alert per failure reason for
        # the same broken channel.
        expr: sum by (integration) (increase(alertmanager_notifications_failed_total[30m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Alertmanager не может доставить уведомления ({{ $labels.integration }}): {{ $value | humanize }} сбоев за 30 минут"
      - alert: CeleryTaskFailures
        expr: sum(increase(anicast_celery_tasks_total{result="failure"}[30m])) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Сбои Celery-задач: {{ $value | humanize }} за 30 минут"
      - alert: ProviderCheckFailures
        expr: sum(increase(anicast_source_checks_total{result="failed"}[1h])) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Много неудачных проверок источников: {{ $value | humanize }} за час"
      - alert: NotificationFailures
        expr: sum(increase(anicast_notification_deliveries_total{result="failed"}[1h])) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Сбои доставки уведомлений: {{ $value | humanize }} за час"
      - alert: AccountEmailFailures
        # Account mail is the only path back into an account for someone who lost
        # their password, and its failure mode is silence: the person sees "check
        # your inbox" and nothing arrives. One failure is worth knowing about,
        # unlike Telegram pushes where a blocked bot is routine.
        expr: sum(increase(anicast_account_emails_total{result="failed"}[1h])) > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Не отправляются письма аккаунтов ({{ $value | humanize }} за час): сброс пароля недоступен"
      - alert: PosterRefreshErrors
        expr: sum(increase(anicast_poster_refresh_total{result="error"}[6h])) > 15
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Много сетевых сбоев обновления постеров: {{ $value | humanize }} за 6 часов"
      - alert: PosterRefreshInvalid
        expr: sum(increase(anicast_poster_refresh_total{result="invalid"}[6h])) > 25
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Постеры отклоняются валидацией (битые/мелкие изображения): {{ $value | humanize }} за 6 часов"
  - name: host
    rules:
      - alert: OffsiteBackupStale
        expr: |
          time() - anicast_offsite_backup_timestamp_seconds{kind="db"} > 7 * 3600
          or time() - anicast_offsite_backup_timestamp_seconds{kind="posters"} > 26 * 3600
          or time() - anicast_offsite_backup_timestamp_seconds{kind="recovery-kit"} > 8 * 86400
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Внешняя копия {{ $labels.kind }} отсутствует или устарела"
      - alert: BackupFreshnessMetricsMissing
        expr: absent(anicast_offsite_backup_timestamp_seconds{kind="db"}) or time() - node_textfile_mtime_seconds{file=~".*backup.prom"} > 900
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Не обновляются метрики внешнего резервного копирования"
      - alert: DiskSpaceWarning
        expr: node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Свободно меньше 15% на / ({{ $value | humanizePercentage }})"
      - alert: DiskSpaceCritical
        expr: node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} < 0.07
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Свободно меньше 7% на / ({{ $value | humanizePercentage }})"
      - alert: MemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Доступно меньше 10% RAM ({{ $value | humanizePercentage }})"
      - alert: CpuBusyHigh
        expr: avg by (job) (1 - avg by (job, cpu, mode) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "CPU занят выше 90% более 10 минут ({{ $labels.job }})"
      - alert: SwapActivityHigh
        expr: sum by (job) (rate(node_vmstat_pswpin[5m]) + rate(node_vmstat_pswpout[5m])) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Активен swap-in/out ({{ $labels.job }}): смотреть вместе с RAM и latency"
      - alert: TlsCertExpiringSoon
        expr: probe_ssl_earliest_cert_expiry{job="site-availability"} - time() < 14 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "TLS-сертификат {{ $labels.instance }} истекает менее чем через 14 дней"
      - alert: TlsCertExpiringCritical
        expr: probe_ssl_earliest_cert_expiry{job="site-availability"} - time() < 7 * 86400
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "TLS-сертификат {{ $labels.instance }} истекает менее чем через 7 дней"
      - alert: NodeExporterDown
        expr: up{job="node"} == 0 or absent(up{job="node"})
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "node-exporter недоступен: метрики хоста не собираются"
      - alert: SiteDown
        expr: probe_success{job="site-availability"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Сайт недоступен снаружи: {{ $labels.instance }}"
      - alert: SiteSlowWarning
        expr: avg_over_time(probe_duration_seconds{job="site-availability"}[10m]) > 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Сайт отвечает медленно: {{ $labels.instance }} ~{{ $value | humanize }}s"
      - alert: VpsNodeExporterDown
        expr: up{job="node-vps"} == 0 or absent(up{job="node-vps"})
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "node-exporter на VPS недоступен: метрики хоста не собираются"
      - alert: AlertmanagerDown
        expr: up{job="alertmanager"} == 0 or absent(up{job="alertmanager"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Alertmanager недоступен: доставка алертов может не работать"

# Deployed on the VPS (root@10.78.0.1:/opt/anicast/infra/monitoring).
# Scraped by the MainServer Prometheus over the AmneziaWG tunnel.
# The Anicast firewall allows this port only from MainServer over awg0.
# Keep the private bind as well — never publish it on 0.0.0.0.
services:
  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    restart: unless-stopped
    command:
      - --path.rootfs=/host/root
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    ports:
      - "10.78.0.1:9100:9100"
    mem_limit: 64m
    logging: &container-logging
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

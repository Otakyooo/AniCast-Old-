# Deployed on the VPS (root@10.78.0.1:/opt/anicast/infra/monitoring).
# Scraped by the MainServer Prometheus over the AmneziaWG tunnel.
# The VPS firewall is disabled, so the port must stay bound to the AWG
# interface only — never publish it on 0.0.0.0.
services:
  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host/root
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    ports:
      - "10.78.0.1:9100:9100"
    mem_limit: 64m
    logging: &container-logging
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

global:
  resolve_timeout: 1m

route:
  receiver: telegram
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /etc/alertmanager/secrets/telegram-token
        chat_id_file: /etc/alertmanager/secrets/telegram-chat-id
        send_resolved: true
        # api.telegram.org is unreachable from this host, so alerts go through
        # the relay Caddy exposes inside the AmneziaWG tunnel. Pointing this at
        # Telegram directly means every notification is retried and dropped —
        # 274 failed deliveries before the relay existed, with nothing to show
        # for them. See docs/OPERATIONS.md.
        api_url: http://10.78.0.1:8443

global:
  resolve_timeout: 1m

route:
  receiver: telegram
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /etc/alertmanager/secrets/telegram-token
        chat_id_file: /etc/alertmanager/secrets/telegram-chat-id
        send_resolved: true
        api_url: https://api.telegram.org

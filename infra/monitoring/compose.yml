services:
  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules:/etc/prometheus/rules:ro
      - ./secrets/metrics-token:/etc/prometheus/secrets/metrics-token:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=4GB
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 256m
    logging: &container-logging
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
    networks: [monitoring]
  alertmanager:
    image: prom/alertmanager:v0.34.0@sha256:690c7b525f4367aa91f73e2f91c632206d32e97c6384bdbf2fb7a861b420340d
    restart: unless-stopped
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./secrets/telegram-token:/etc/alertmanager/secrets/telegram-token:ro
      - ./secrets/telegram-chat-id:/etc/alertmanager/secrets/telegram-chat-id:ro
    ports:
      - "127.0.0.1:9093:9093"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 64m
    logging: *container-logging
    networks: [monitoring]
  metrics-proxy:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    restart: unless-stopped
    volumes:
      - ./nginx/metrics-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 48m
    logging: *container-logging
    # `backend` is the scrape-only network that carries the backend alone. The
    # proxy used to join mainserver_internal, which also carries PostgreSQL and
    # Redis, so the monitoring stack held a path into the application's data
    # tier for the sake of one HTTP endpoint.
    networks: [monitoring, backend]
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
    restart: unless-stopped
    volumes:
      - ./blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    mem_limit: 48m
    logging: *container-logging
    networks: [monitoring]
  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    restart: unless-stopped
    command:
      - --path.rootfs=/host/root
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.textfile.directory=/textfile
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
      - ../../backups/metrics:/textfile:ro
    mem_limit: 64m
    logging: *container-logging
    networks: [monitoring]
networks:
  monitoring:
  backend:
    external: true
    name: mainserver_metrics
volumes:
  prometheus_data:

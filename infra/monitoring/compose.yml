services:
  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules:/etc/prometheus/rules:ro
      - ./secrets/metrics-token:/etc/prometheus/secrets/metrics-token:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 256m
    logging: &container-logging
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
    networks: [monitoring]
  alertmanager:
    image: prom/alertmanager:v0.34.0
    restart: unless-stopped
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./secrets/telegram-token:/etc/alertmanager/secrets/telegram-token:ro
      - ./secrets/telegram-chat-id:/etc/alertmanager/secrets/telegram-chat-id:ro
    ports:
      - "127.0.0.1:9093:9093"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 64m
    logging: *container-logging
    networks: [monitoring]
  metrics-proxy:
    image: nginx:1.29-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/metrics-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 48m
    logging: *container-logging
    networks: [monitoring, backend]
  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host/root
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    mem_limit: 64m
    logging: *container-logging
    networks: [monitoring]
networks:
  monitoring:
  backend:
    external: true
    name: mainserver_internal
volumes:
  prometheus_data:

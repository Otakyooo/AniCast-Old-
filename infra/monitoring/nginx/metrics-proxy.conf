# Single-purpose proxy: adds the X-Forwarded-Proto header that Django's
# SECURE_PROXY_SSL_HEADER/SECURE_SSL_REDIRECT handling requires and hides
# the backend listener topology from the monitoring network. The client
# Authorization header is passed through unchanged.
server {
    listen 8080;

    location = /metrics {
        # Resolve the backend at request time: nginx otherwise caches the
        # container IP forever and returns 502 after the stack is recreated.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_endpoint http://backend:8000/internal/metrics;
        proxy_pass $backend_endpoint;
        proxy_http_version 1.1;
        proxy_set_header Host anicast.online;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 404;
    }
}

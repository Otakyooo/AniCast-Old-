name: publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  BACKEND_IMAGE: ghcr.io/otakyooo/anicast-backend
  FRONTEND_IMAGE: ghcr.io/otakyooo/anicast-frontend
  # Public by design: embedded into the client bundle on every build.
  NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: anicast_auth_bot
  NEXT_PUBLIC_TELEGRAM_NOTIFY_BOT_USERNAME: anicast_push_bot
  # Baked into the frontend rewrites at build time; the backend is only
  # reachable at this tunnel address from the VPS.
  API_INTERNAL_URL: http://10.78.0.2:8000
  # Baked into the media remote pattern and the character image check.
  NEXT_PUBLIC_SITE_URL: https://anicast.online

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  backend:
    needs: checks
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: backend
          push: true
          platforms: linux/amd64
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.ref_name == 'main' && 'main' || github.ref_name }}
            ${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }}
      - name: release manifest hint
        run: |
          {
            echo '### Backend image (mainserver release)'
            echo '```dotenv'
            echo "BACKEND_IMAGE=${BACKEND_IMAGE}@${{ steps.build.outputs.digest }}"
            echo "RELEASE_SHA=${{ github.sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
  frontend:
    needs: checks
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: frontend
          push: true
          platforms: linux/amd64
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          build-args: |
            NEXT_PUBLIC_TELEGRAM_BOT_USERNAME=${{ env.NEXT_PUBLIC_TELEGRAM_BOT_USERNAME }}
            NEXT_PUBLIC_TELEGRAM_NOTIFY_BOT_USERNAME=${{ env.NEXT_PUBLIC_TELEGRAM_NOTIFY_BOT_USERNAME }}
            API_INTERNAL_URL=${{ env.API_INTERNAL_URL }}
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.ref_name == 'main' && 'main' || github.ref_name }}
            ${{ env.FRONTEND_IMAGE }}:sha-${{ github.sha }}
      - name: release manifest hint
        run: |
          {
            echo '### Frontend image (vps release)'
            echo '```dotenv'
            echo "FRONTEND_IMAGE=${FRONTEND_IMAGE}@${{ steps.build.outputs.digest }}"
            echo "RELEASE_SHA=${{ github.sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  manifests:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate validated deployment manifests
        env:
          BACKEND_DIGEST: ${{ needs.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ needs.frontend.outputs.digest }}
          RELEASE_SHA: ${{ github.sha }}
        run: python3 scripts/create-release-manifests.py release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 90

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest
        env:
          DJANGO_DATABASE_URL: sqlite:///db.sqlite3
      - run: ruff check .
      - run: mypy .
        env:
          DJANGO_DATABASE_URL: sqlite:///db.sqlite3
      - run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_DATABASE_URL: sqlite:///db.sqlite3
      - run: python manage.py check
        env:
          DJANGO_DATABASE_URL: sqlite:///db.sqlite3
      - run: python manage.py check --deploy
        env:
          DJANGO_DATABASE_URL: sqlite:///db.sqlite3
          DJANGO_SECRET_KEY: ci-only-long-random-secret-not-used-in-production

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp infra/mainserver/env.example infra/mainserver/.env
      - run: cp infra/vps/env.example infra/vps/.env
      - run: sh scripts/validate.sh
      - run: docker compose -f infra/mainserver/compose.yml config -q
      - run: docker compose -f infra/vps/compose.yml config -q
      - run: docker build backend
      - run: docker build frontend
      - run: docker run --rm -v "$PWD/infra/vps/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - run: git diff --check
